trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - week-10/*

pool:
  name: SelfHostedPool

variables:
  - group: epicbook-secrets

stages:
  - stage: Validate
    displayName: Validate Ansible
    jobs:
      - job: validate
        steps:
          - checkout: self
          - script: |
              node --version
              npm ci --omit=dev --no-audit --no-fund
            displayName: Install Node dependencies (npm ci)
          - task: DownloadSecureFile@1
            name: sshKey
            displayName: Download SSH key from Secure Files
            inputs:
              secureFile: epicbook-key
          - script: chmod 600 "$(sshKey.secureFilePath)"
            displayName: Restrict key permissions
          - script: |
              ansible-galaxy collection install -r ansible/requirements.yml
              ansible-playbook -i ansible/inventory/hosts.ini ansible/site.yml --syntax-check
              ansible -i ansible/inventory/hosts.ini all -m ping --private-key "$(sshKey.secureFilePath)"
            displayName: Syntax check and SSH connectivity
            env:
              ANSIBLE_DEPRECATION_WARNINGS: 'false'

  - stage: Deploy
    displayName: Deploy EpicBook
    dependsOn: Validate
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: deploy
        steps:
          - checkout: self
          - task: DownloadSecureFile@1
            name: sshKey
            displayName: Download SSH key from Secure Files
            inputs:
              secureFile: epicbook-key
          - script: chmod 600 "$(sshKey.secureFilePath)"
            displayName: Restrict key permissions
          - script: |
              ansible-playbook -i ansible/inventory/hosts.ini ansible/site.yml --private-key "$(sshKey.secureFilePath)"
            displayName: Run Ansible playbook
            env:
              MYSQL_PASSWORD: $(mysql_admin_password)
              ANSIBLE_DEPRECATION_WARNINGS: 'false'
              ANSIBLE_FORCE_COLOR: 'false'