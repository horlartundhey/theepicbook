---
- name: Configure common baseline on all hosts
  hosts: all
  become: true
  roles:
    - common

- name: Configure frontend (Nginx)
  hosts: frontend
  become: true
  roles:
    - frontend

- name: Configure backend (EpicBook) and database
  hosts: backend
  become: true
  roles:
    - backend
    - database

- name: Verify backend service and database
  hosts: backend
  become: true
  tasks:
    - name: Confirm epicbook service is active
      ansible.builtin.systemd:
        name: epicbook
      register: epicbook_status
      failed_when: epicbook_status.status.ActiveState != "active"

    - name: Confirm backend port is listening
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ backend_app_port }}"
        timeout: 20

    - name: Count books in the database
      community.mysql.mysql_query:
        login_host: "{{ mysql_fqdn }}"
        login_user: "{{ db_admin_username }}"
        login_password: "{{ db_admin_password }}"
        login_db: "{{ db_name }}"
        query: "SELECT COUNT(*) AS row_count FROM Book"
      register: verify_book_count
      changed_when: false
      no_log: true

    - name: Fail if Book table is empty
      ansible.builtin.fail:
        msg: "Book table has no rows"
      when: verify_book_count.query_result[0][0].row_count == 0

- name: Verify frontend
  hosts: frontend
  become: true
  tasks:
    - name: Confirm Nginx is active
      ansible.builtin.systemd:
        name: nginx
      register: nginx_status
      failed_when: nginx_status.status.ActiveState != "active"

    - name: Confirm frontend serves the app
      ansible.builtin.uri:
        url: http://127.0.0.1/
        status_code: 200
